<div class="d-flex flex-column justify-content-center" style="min-height: 85vh;">

    <div class="px-4">

        <template x-if="registerForm.success">
            <div class="text-center py-5">
                <div class="bg-success bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4" style="width: 100px; height: 100px;">
                    <i class="bi bi-check-lg text-success" style="font-size: 4rem;"></i>
                </div>
                <h3 class="fw-bold text-dark mb-2">Registration Submitted!</h3>
                <p class="text-muted mb-4 px-3" x-text="registerForm.success"></p>
                <div class="d-flex flex-column gap-3 px-2">
                    <button class="btn btn-primary btn-lg rounded-pill py-3 fw-bold shadow-sm"
                            @click="registerForm.success = ''; view = 'login'">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Go to Login
                    </button>
                    <button class="btn btn-white btn-lg rounded-pill py-3 fw-bold border shadow-sm text-muted"
                            @click="registerForm.success = ''">
                        Register Another
                    </button>
                </div>
            </div>
        </template>

        <template x-if="!registerForm.success">
            <div class="card border-0 shadow-lg rounded-5 overflow-hidden">
                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <div class="bg-success bg-gradient text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3 shadow-sm" style="width: 70px; height: 70px;">
                            <i class="bi bi-person-plus-fill fs-2"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-1">New Resident</h4>
                        <p class="text-muted small mb-0">Register to access the society app</p>
                    </div>

                    <form @submit.prevent="registerResident()">

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted ms-1">
                                Select Your Flat
                                <span class="badge bg-purple text-white ms-2" style="background-color: #7c3aed !important; font-size: 0.65rem;">Unregistered Only</span>
                            </label>
                            <select x-model="registerForm.flatNo"
                                    class="form-select rounded-4 border-light bg-light py-3 fw-bold"
                                    required>
                                <option value="">-- Select Flat --</option>
                                <template x-for="flat in availableFlatsForRegister" :key="flat">
                                    <option :value="flat" x-text="'Flat ' + flat"></option>
                                </template>
                            </select>
                            <div class="mt-2 p-2 rounded-3" style="background-color: rgba(124, 58, 237, 0.1); border-left: 3px solid #7c3aed;">
                                <small class="fw-bold" style="color: #7c3aed;">
                                    <i class="bi bi-info-circle me-1"></i>Only unregistered flats are shown
                                </small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted ms-1">Full Name</label>
                            <input type="text" x-model="registerForm.name"
                                   class="form-control rounded-4 border-light bg-light py-3"
                                   placeholder="Enter your full name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted ms-1">Mobile Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-light rounded-start-4 fw-bold text-muted">+91</span>
                                <input type="tel" x-model="registerForm.phone"
                                       class="form-control border-light bg-light rounded-end-4 py-3 fw-bold"
                                       placeholder="Enter mobile number"
                                       maxlength="15"
                                       inputmode="tel"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted ms-1">Email <span class="text-muted fw-normal">(Optional)</span></label>
                            <input type="email" x-model="registerForm.email"
                                   class="form-control rounded-4 border-light bg-light py-3"
                                   placeholder="Enter email address">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted ms-1">Resident Type</label>
                            <div class="bg-light p-1 rounded-4 border d-flex">
                                <button type="button" class="btn flex-fill rounded-4 py-2 fw-bold transition-all"
                                        :class="registerForm.residentType === 'Owner' ? 'bg-success text-white shadow-sm' : 'text-muted'"
                                        @click="registerForm.residentType = 'Owner'">
                                    <i class="bi bi-house-fill me-1"></i>Owner
                                </button>
                                <button type="button" class="btn flex-fill rounded-4 py-2 fw-bold transition-all"
                                        :class="registerForm.residentType === 'Tenant' ? 'bg-warning text-dark shadow-sm' : 'text-muted'"
                                        @click="registerForm.residentType = 'Tenant'">
                                    <i class="bi bi-person-fill me-1"></i>Tenant
                                </button>
                            </div>
                        </div>

                        <div x-show="registerForm.error"
                             class="alert py-2 small mb-3 rounded-3 text-center border-0 bg-danger bg-opacity-10 text-danger fw-bold"
                             x-text="registerForm.error">
                        </div>

                        <div class="text-center">
                            <button type="submit"
                                    class="btn btn-primary rounded-pill py-3 px-5 fw-bold shadow-sm d-inline-flex align-items-center justify-content-center gap-2"
                                    :disabled="registerForm.isSubmitting"
                                    x-cloak>
                                <template x-if="!registerForm.isSubmitting">
                                    <span>
                                        <i class="bi bi-send-fill me-1"></i> Submit Registration
                                    </span>
                                </template>
                                <template x-if="registerForm.isSubmitting">
                                    <span class="d-flex align-items-center gap-2">
                                        <span class="spinner-border spinner-border-sm" role="status"></span> Submitting...
                                    </span>
                                </template>
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <button class="btn btn-link text-muted small text-decoration-none fw-bold"
                                @click="view = 'login'; registerForm.error = ''; registerForm.success = '';">
                            <i class="bi bi-arrow-left me-1"></i> Back to Login
                        </button>
                    </div>

                </div>
            </div>
        </template>

        <div class="text-center mt-3">
            <small class="text-muted" style="font-size: 0.65rem;">
                <i class="bi bi-info-circle-fill me-1"></i>
                Your registration will be validated by a society admin before activation
            </small>
        </div>
    </div>

</div>
